name: Refresh DSA snapshot

on:
  schedule:
    - cron: '17 3 * * *'   # once a day — commit history doesn't need second-fresh syncing
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-dsa-snapshot.js

      - name: Commit if changed
        run: |
          git config user.name "dsa-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dsa-progress.json
          if git diff --cached --quiet; then
            echo "No changes — solutions repo activity unchanged since last run."
          else
            git commit -m "Refresh DSA progress snapshot [automated]"
            git push
          fi
