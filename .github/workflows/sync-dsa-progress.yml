name: Sync DSA progress

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download tracker data from solutions repository
        env:
          DSA_SOURCE_URL: ${{ vars.DSA_SOURCE_URL }}
        run: node scripts/sync-dsa-progress.mjs
      - name: Commit updated tracker data
        run: |
          git diff --quiet data/dsa-progress.json || {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/dsa-progress.json
            git commit -m 'chore: sync DSA progress'
            git push
          }
